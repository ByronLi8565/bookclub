# Secrets for the deployed Worker, encrypted at rest with age so the values can
# live in the repo. The private identity does not: it sits at
# ~/.config/fnox/age.txt (mode 600) and is the only thing that can read these.
#
# Add a secret:   fnox set NAME            (prompts, or reads stdin)
# Read one:       fnox get NAME
# Push to prod:   bun run secrets:sync     (== fnox exec -- bash scripts/sync-secrets.sh)
#
# SESSION_HMAC_SECRET is deliberately absent. It is already set on the Worker,
# nothing local needs it, and rotating it invalidates every session cookie —
# which signs out every reader at once. Add it here only if it is ever rotated
# on purpose.
[providers.local]
type = "age"
recipients = ["age13lgmwnjmr3qm37ffgxd45l97rycwhdrv3zdguxqjra7tu6c2e5lq2retzv"]
key_file = "~/.config/fnox/age.txt"

[secrets]
ADMIN_API_TOKEN = { provider = "local", value = "" }
EMAIL_FROM = { provider = "local", value = "" }
